html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
  font-weight:400;-webkit-font-smoothing:antialiased}
body{padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 40px);
  max-width:560px;margin:0 auto;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
button,label,.set,.stepper,.toggle,.card,.ex-head,.chip{touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);
  border-radius:4px;padding:10px 11px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--fg)}
input[type=number]{font-family:var(--mono)}

.top{display:flex;align-items:baseline;gap:14px;margin-bottom:26px;min-height:28px}
.top h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0;flex:1}
.back{color:var(--mute);font-size:14px;font-weight:400}
.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-weight:500}

.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;
  padding:16px;margin-bottom:8px;display:block;width:100%;text-align:left}
.card h2{margin:0 0 4px;font-size:16px;font-weight:500;letter-spacing:-.01em}
.card p{margin:0;font-size:13px;color:var(--mute);line-height:1.5;font-weight:300}
.card.running{border-color:var(--fg)}
.card.running p{color:var(--fg)}

.ex{background:var(--panel);border:1px solid var(--line);border-radius:4px;margin-bottom:10px;overflow:hidden}
.ex-head{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.ex-head h2{margin:0;font-size:16px;font-weight:500;flex:1;letter-spacing:-.01em}
.tag{font-family:var(--mono);font-size:10.5px;color:var(--mute);border:1px solid var(--line);
  border-radius:999px;padding:3px 9px;white-space:nowrap}
.gear{color:var(--mute);font-size:16px;padding:2px 4px}

/* Satzzeilen. Der Streifen unten zeigt die Last im Verhältnis zu Satz 1. */
.pyr{padding:0 16px 8px}
.set{position:relative;margin-bottom:6px;border-radius:4px;overflow:hidden;
  border:1px solid var(--line);display:flex;align-items:center;min-height:54px;
  padding:9px 13px;gap:10px;transition:border-color .15s}
.set.active{border-color:var(--fg)}
.set.done{border-color:var(--dim)}
.set.fixing{border-color:var(--fg);background:#0F0F0F}
.set .fill{position:absolute;left:0;bottom:0;height:2px;background:var(--fg);opacity:.5;z-index:0}
.set.done .fill{opacity:.25}
.set > *{position:relative;z-index:1}
.set .n{font-family:var(--mono);font-size:10px;color:var(--mute);width:14px;flex:none}
.set .w{flex:1;min-width:0}
.set .w b{font-family:var(--mono);font-size:19px;font-weight:500;letter-spacing:-.02em;display:block;line-height:1.2}
.set .w small{font-size:10.5px;color:var(--mute);font-family:var(--mono);display:block;margin-top:3px}
.set .r{font-family:var(--mono);font-size:12px;color:var(--mute);flex:none;text-align:right;max-width:46%}
.set .r em{font-style:normal;font-size:19px;color:var(--fg);font-weight:500}
.set .r u{text-decoration:none;color:var(--dim);font-size:13px;margin-left:2px}
.set .r small{display:block;font-size:10px;color:var(--mute);margin-top:2px}
.set .r small.up{color:var(--fg)}
.set .r small.dn{color:var(--dim)}

.entry{padding:4px 16px 16px}
.stepper{display:flex;align-items:center;gap:14px;justify-content:center;margin:8px 0 12px}
.stepper button{width:54px;height:54px;border-radius:4px;border:1px solid var(--line);
  font-size:22px;font-weight:300;line-height:1}
.stepper .val{font-family:var(--mono);font-size:36px;font-weight:500;min-width:84px;
  text-align:center;letter-spacing:-.03em}
.stepper .val span{font-size:10px;color:var(--mute);display:block;font-weight:400;
  letter-spacing:.14em;text-transform:uppercase;margin-top:1px}
.btn{display:block;width:100%;text-align:center;padding:15px;border-radius:4px;
  font-weight:500;font-size:14px;letter-spacing:.01em}
.btn.primary{background:var(--fg);color:#000}
.btn.ghost{border:1px solid var(--line);color:var(--mute);font-weight:400}
.btn+.btn{margin-top:8px}

/* Pausenuhr, klebt oben */
.clock{position:sticky;top:6px;z-index:30;display:flex;align-items:center;gap:12px;
  background:rgba(0,0,0,.88);border:1px solid var(--line);border-radius:4px;
  padding:11px 8px 11px 14px;margin-bottom:14px;
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.clock .t{font-family:var(--mono);font-size:24px;font-weight:500;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.clock .lbl{font-size:11px;color:var(--mute);flex:1;line-height:1.3}
.clock .x{color:var(--mute);font-size:14px;padding:6px 10px}
.clock.ready{background:var(--fg);border-color:var(--fg)}
.clock.ready .t,.clock.ready .lbl,.clock.ready .x{color:#000}

.note{font-size:12.5px;line-height:1.55;color:var(--mute);border-left:1px solid var(--fg);
  padding:2px 0 2px 13px;margin:0 16px 14px;font-weight:300}
.note b{color:var(--fg);font-weight:500}
.empty{text-align:center;color:var(--mute);font-size:13.5px;padding:34px 10px;
  line-height:1.6;font-weight:300}

.field{margin-bottom:13px}
.field label{display:block;font-size:11px;color:var(--mute);margin-bottom:6px;letter-spacing:.02em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hr{height:1px;background:var(--line);margin:24px 0}
.log{font-family:var(--mono);font-size:12px;color:var(--mute);line-height:1.8}
.log b{color:var(--fg);font-weight:500}
.up{color:var(--fg)}

/* Habit Tracker */
.habit{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px;margin-bottom:10px}
.stats{display:flex;gap:22px;margin-bottom:16px}
.stat b{font-family:var(--mono);font-size:25px;font-weight:500;display:block;
  letter-spacing:-.03em;line-height:1.05}
.stat b i{font-style:normal;font-size:14px;color:var(--mute);font-weight:400}
.stat span{font-size:9.5px;color:var(--mute);letter-spacing:.14em;text-transform:uppercase;
  display:block;margin-top:5px}
.cal{display:flex;gap:3px;align-items:stretch}
.cal .dow{display:flex;flex-direction:column;gap:3px;width:15px;flex:none}
.cal .dow em{flex:1;font-style:normal;font-size:8px;color:var(--dim);display:flex;align-items:center}
.cal .col{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.cal i{aspect-ratio:1;border-radius:1px;background:#141414;border:1px solid transparent;display:block}
.cal i.on{background:var(--fg)}
.cal i.now{border-color:var(--dim)}
.cal i.fut{opacity:.4}
.calfoot{display:flex;justify-content:space-between;font-size:10px;color:var(--mute);
  margin-top:10px;letter-spacing:.04em}

/* Auswahlleisten für Studio und Übung */
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px;
  -webkit-overflow-scrolling:touch}
.chip{flex:none;font-size:12px;padding:8px 13px;border-radius:999px;
  border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip.on{border-color:var(--fg);color:var(--fg)}

.toggle{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  border:1px solid var(--line);border-radius:4px;padding:13px 14px}
.toggle span{flex:1}
.toggle b{display:block;font-size:14px;font-weight:500}
.toggle small{display:block;font-size:11.5px;color:var(--mute);margin-top:2px;font-weight:300}
.sw{flex:none;width:42px;height:24px;border-radius:999px;border:1px solid var(--line);
  position:relative;transition:background .18s,border-color .18s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;
  background:var(--dim);transition:transform .18s,background .18s}
.sw.on{background:var(--fg);border-color:var(--fg)}
.sw.on:after{transform:translateX(18px);background:#000}

.backup{display:flex;align-items:center;gap:12px;border:1px solid var(--line);
  border-radius:4px;padding:13px 13px 13px 15px;margin-bottom:10px}
.backup span{flex:1}
.backup b{display:block;font-size:13.5px;font-weight:500}
.backup small{display:block;font-size:11.5px;color:var(--mute);margin-top:2px;font-weight:300}
.backup .mini{flex:none;font-size:12.5px;font-weight:500;color:#000;background:var(--fg);
  padding:9px 15px;border-radius:4px;text-decoration:none}

.card .hd{display:flex;align-items:baseline;gap:10px;margin-bottom:11px}
.card .hd h2{flex:1;margin:0}
.card .hd span{font-size:11px;color:var(--mute);font-weight:300;flex:none}
.card.running .hd span{color:var(--fg)}
.card .rows{display:flex;flex-direction:column;gap:6px}
.card .rows > div{display:flex;align-items:baseline;gap:12px}
.card .rows em{font-style:normal;color:var(--mute);font-weight:300;font-size:12.5px;
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .rows b{font-family:var(--mono);font-size:12.5px;font-weight:500;flex:none}
.card .rows b i{font-style:normal;color:var(--mute);font-size:10.5px;font-weight:400}
.card .rows b.none{color:var(--dim);font-weight:400;font-size:11.5px}
</style>
</head>

<script>
/* ============================================================
   RPT — Reverse Pyramid Training
   Logik nach leangains.com/reverse-pyramid-training-guide
   - Abhängiges System: alle Sätze leiten sich von Satz 1 ab
   - Breakdown: Satz n = Satz1 × (1 − bd × (n−1))
   - Doppelte Progression: Wdh. in Satz 1 > Ziel → nächstes Mal mehr
   - Jeder Satz ist AMRAP
   ============================================================ */

const S = (() => { try { localStorage.setItem('_t','1'); localStorage.removeItem('_t'); return localStorage; }
  catch(e){ const m={}; return {getItem:k=>k in m?m[k]:null, setItem:(k,v)=>{m[k]=String(v)}}; } })();

const DEFAULTS = {
  // ACHTUNG: v nur hochzählen, wenn der gespeicherte Stand absichtlich
  // verworfen werden soll. Sonst sind Verlauf und Gewichte weg. Für
  // Strukturänderungen stattdessen migrate() erweitern.
  v: 4,
  bw: 80,                                  // Körpergewicht für Klimmzüge
  sound: true,                             // Signalton am Pausenende
  backupEvery: 3,                          // nach wie vielen Einheiten erinnert wird
  // Eine Ausrüstung, kein Umschalten. Der kleinste Schritt ist der gröbste,
  // den du irgendwo vorfindest, damit jede Last überall auflegbar ist.
  equip: {bar:20, step:2.5, stack:1, plates:[20,15,10,5,2.5]},
  days: [
    { id:'d1', name:'Tag 1', sub:'Deadlift · Overhead Press · Bizeps', ex:[
      {id:'dl',  name:'Deadlift',       goal:6,  sets:2, bd:.10, mode:'side', bar:20, top:{}, inc:0, rest:240},
      {id:'ohp', name:'Overhead Press', goal:8,  sets:3, bd:.05, mode:'side', bar:20, top:{}, inc:0, rest:180},
      {id:'bi1', name:'Bizeps',         goal:10, sets:2, bd:.10, mode:'side', bar:0, top:{}, inc:0, rest:90},
    ]},
    { id:'d2', name:'Tag 2', sub:'Bankdrücken · Seal Row · Trizeps', ex:[
      {id:'bp',  name:'Bankdrücken',    goal:8,  sets:3, bd:.05, mode:'side', bar:20, top:{}, inc:0, rest:180},
      {id:'sr',  name:'Seal Row',       goal:8,  sets:3, bd:.05, mode:'side', bar:20, top:{}, inc:0, rest:180},
      {id:'tri', name:'Trizeps',        goal:10, sets:2, bd:.10, mode:'total',bar:0, top:{}, inc:0,    rest:90},
    ]},
    { id:'d3', name:'Tag 3', sub:'Squat · Klimmzüge · Bizeps', ex:[
      {id:'sq',  name:'Squat',          goal:10, sets:3, bd:.10, mode:'side', bar:20, top:{}, inc:0, rest:240},
      {id:'cu',  name:'Klimmzüge',      goal:8,  sets:3, bd:.10, mode:'bw',   bar:0, top:{}, inc:0, rest:180},
      {id:'bi2', name:'Bizeps',         goal:10, sets:2, bd:.10, mode:'side', bar:0, top:{}, inc:0, rest:90},
    ]},
  ],
  log: []   // { date, dayId, gym, ex:[{id,name,sets:[{val,total,reps}],oldTop,newTop}] }
};

let st = load(), view = {name:'home'}, timer = null;

function load(){
  try {
    const r = S.getItem('rpt.state');
    if(r){
      const p = JSON.parse(r);
      if(p && p.v === 2) migrate(p);
      if(p && p.v === 3) migrate3(p);
      if(p && p.v === 4){ backfill(p); return p; }
    }
  } catch(e){}
  return JSON.parse(JSON.stringify(DEFAULTS));
}

// Fehlende Felder aus den DEFAULTS nachtragen, ohne Daten zu überschreiben
function backfill(p){
  if(!p.equip) p.equip = JSON.parse(JSON.stringify(DEFAULTS.equip));
  const e = p.equip;
  if(!(e.step > 0)) e.step = 2.5;
  if(!(e.stack > 0)) e.stack = 1;
  if(!(e.bar >= 0)) e.bar = 20;
  if(!Array.isArray(e.plates) || !e.plates.length) e.plates = [20,15,10,5,2.5];
  (p.days||[]).forEach(d => (d.ex||[]).forEach(e => {
    if(e.top && typeof e.top === 'object') e.top = Object.values(e.top).find(v => v > 0) || 0;
  }));
}
function save(){ try{ S.setItem('rpt.state', JSON.stringify(st)); }catch(e){} }

/* v2 -> v3: Ausrüstung wandert vom Einzelgerät ins Studio, Arbeitsgewichte
   werden je Studio geführt. Bestehende Werte landen im ersten Studio. */
function migrate(p){
  p.gyms = [
    {id:'g1', name:'Studio 1',   bar:20, step:1.25, stack:1,
     plates: Array.isArray(p.plates) && p.plates.length ? p.plates : [20,15,10,5,2.5,1.25]},
    {id:'g2', name:'Freinsheim', bar:20, step:2.5,  stack:1, plates:[20,15,10,5,2.5]},
  ];
  p.gym = 'g1'; delete p.plates;
  (p.days||[]).forEach(d => (d.ex||[]).forEach(e => {
    if(e.top && typeof e.top === 'object') e.top = Object.values(e.top).find(v => v > 0) || 0;
    e.inc = 0; delete e.step;
    if(e.bar) e.bar = 20;
  }));
  p.v = 3;
}

/* v3 -> v4: Studios fallen weg. Übernommen wird das gröbste Raster, damit sich
   jede gespeicherte Last überall auflegen lässt. */
function migrate3(p){
  const gs = Array.isArray(p.gyms) && p.gyms.length ? p.gyms : [{bar:20, step:2.5, stack:1, plates:[20,15,10,5,2.5]}];
  const coarse = gs.reduce((a,b) => (b.step||2.5) > (a.step||2.5) ? b : a);
  p.equip = { bar: coarse.bar || 20, step: coarse.step || 2.5,
              stack: coarse.stack || 1,
              plates: coarse.plates && coarse.plates.length ? coarse.plates : [20,15,10,5,2.5] };
  delete p.gyms; delete p.gym;
  p.v = 4;
}

/* ---------- Rechnen ---------- */
const round = (x, step) => Math.round(x/step)*step;

/* ---------- Ausrüstung ----------
   Ein Profil für alles. Übungen an Maschinen oder Kurzhanteln können einen
   eigenen Schritt haben, dafür ex.step. */
function eq(){ return st.equip; }
function stepOf(ex){
  if(ex.step > 0) return ex.step;
  return ex.mode === 'total' ? (eq().stack || 1) : eq().step;
}
function barOf(ex){ return (ex.mode === 'side' && ex.bar > 0) ? eq().bar : 0; }
/* Ein Arbeitsgewicht je Übung, studioübergreifend. Das Studio bestimmt nur,
   auf welche Last sich das auflegen lässt, nicht wie stark du bist. */
function topOf(ex){
  const t = ex.top;
  if(t && typeof t === 'object') return Object.values(t).find(v => v > 0) || 0;
  return t || 0;
}
function setTop(ex, v){ ex.top = v; }
function incOf(ex){ const s = stepOf(ex); return Math.max(s, round(ex.inc || 0, s)); }
const fmt = n => (Math.round(n*100)/100).toString().replace('.', ',');

// Gesamtlast, die tatsächlich am Körper hängt
function toTotal(ex, val, bw){
  if(ex.mode==='side') return barOf(ex) + 2*val;
  if(ex.mode==='bw')   return bw + val;
  return val;
}
// zurück auf den Wert, den man einstellt/auflegt
function fromTotal(ex, total, bw, down){
  const sp = stepOf(ex);
  // down: abrunden. Für Satz 1, damit grobe Scheiben die Last nie erhöhen.
  const r = v => Math.max(0, down ? Math.floor((v + 1e-9)/sp)*sp : round(v, sp));
  if(ex.mode==='side') return r((total - barOf(ex))/2);
  if(ex.mode==='bw')   return r(total - bw);
  return r(total);
}

// Die Pyramide: Satz 1 ist der Anker, alle anderen hängen daran
function plan(ex){
  // Deload-Tag: Guide empfiehlt Deload-Tage statt -wochen, alle Lasten −15 %
  const dl = st.sess && st.sess.deload ? .85 : 1;
  // Satz 1 wird auf das gerundet, was im aktuellen Studio auflegbar ist
  const v1 = fromTotal(ex, toTotal(ex, topOf(ex), st.bw) * dl, st.bw, true);
  const t1 = toTotal(ex, v1, st.bw), out = [];
  for(let n=1; n<=ex.sets; n++){
    const val = n===1 ? v1 : fromTotal(ex, t1*(1 - ex.bd*(n-1)), st.bw);
    out.push({ n, val, total: toTotal(ex, val, st.bw), ratio: t1>0 ? toTotal(ex,val,st.bw)/t1 : 1 });
  }
  return out;
}

function label(ex, val){
  if(ex.mode==='side') return fmt(val)+' kg <span style="font-size:.62em;color:var(--mute)">/ Seite</span>';
  if(ex.mode==='bw')   return val>0 ? 'KG + '+fmt(val)+' kg' : 'nur Körpergewicht';
  return fmt(val)+' kg';
}
function sub(ex, val, total){
  if(ex.mode==='side') return plates(val) + (barOf(ex)>0 ? ' · '+fmt(total)+' kg gesamt' : '');
  if(ex.mode==='bw')   return fmt(total)+' kg Systemlast';
  return '';
}
function plates(perSide){
  let r = perSide, parts = [];
  for(const p of eq().plates){ const c = Math.floor((r+1e-9)/p); if(c>0){ parts.push(c+'×'+fmt(p)); r -= c*p; } }
  return parts.length ? parts.join(' + ') : '—';
}
// Epley: Gewicht, mit dem das Ziel voraussichtlich exakt erreicht wird
function calibrate(ex, total, reps){
  const oneRM = total * (1 + reps/30);
  return oneRM / (1 + ex.goal/30);
}

const el = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const head = (title, back) => `<div class="top">
  ${back ? `<button class="back" data-go='${esc(back)}'>‹ Zurück</button>` : ''}
  <h1>${esc(title)}</h1></div>`;

/* ---- Habit Tracker ----
   Serie wird in Wochen gezählt, nicht in Tagen: bei 3 Einheiten pro Woche
   ist eine Tagesserie das falsche Maß. Eine Woche zählt ab 3 Einheiten. */
function weekStart(d){ const x = new Date(d); x.setHours(0,0,0,0);
  x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; }

function habit(){
  const WEEKS = 16, target = st.days.length;
  const today = new Date(); today.setHours(0,0,0,0);
  const trained = new Map();
  st.log.forEach(s => { const k = new Date(s.date).toDateString();
    trained.set(k, (trained.get(k)||'') + ' ' + s.dayName); });
  const inWeek = t => st.log.filter(s => weekStart(s.date).getTime() === t).length;

  const cur = weekStart(today);
  let streak = inWeek(cur.getTime()) >= target ? 1 : 0;          // laufende Woche zählt erst, wenn voll
  for(const w = new Date(cur);;){ w.setDate(w.getDate()-7);
    if(inWeek(w.getTime()) >= target) streak++; else break; }

  const first = new Date(cur); first.setDate(first.getDate() - 7*(WEEKS-1));
  let cols = '';
  for(let i=0;i<WEEKS;i++){
    let cells = '';
    for(let j=0;j<7;j++){
      const d = new Date(first); d.setDate(first.getDate() + i*7 + j);
      const on = trained.has(d.toDateString());
      cells += `<i class="${on?'on':''}${d.getTime()===today.getTime()?' now':''}${d>today?' fut':''}"
        title="${d.toLocaleDateString('de-DE')}${on?' ·'+trained.get(d.toDateString()):''}"></i>`;
    }
    cols += `<div class="col">${cells}</div>`;
  }

  const last = st.log.length ? st.log[st.log.length-1] : null;
  const since = last ? Math.floor((today - new Date(new Date(last.date).toDateString()))/864e5) : null;
  const gap = last ? (since===0 ? 'heute trainiert' : since===1 ? 'gestern trainiert'
      : `letzte Einheit vor ${since} Tagen`) : 'noch keine Einheit';

  return `<div class="habit">
    <div class="stats">
      <div class="stat"><b>${streak}</b><span>Wochen&nbsp;Serie</span></div>
      <div class="stat"><b>${inWeek(cur.getTime())}<i>/${target}</i></b><span>diese Woche</span></div>
      <div class="stat"><b>${st.log.length}</b><span>gesamt</span></div>
    </div>
    <div class="cal">
      <div class="dow"><em>Mo</em><em></em><em>Mi</em><em></em><em>Fr</em><em></em><em>So</em></div>
      ${cols}
    </div>
    <div class="calfoot"><span>${first.toLocaleDateString('de-DE',{month:'short',year:'2-digit'})}</span>
      <span>${gap}</span></div></div>`;
}

/* ============================================================
   Fortschritt: Pixel-Figur, Kraftkurve, geschätztes 1RM
   Die Figur wächst an Gewichtssteigerungen, nicht an Volumen.
   Bewusst so: der Guide rät bei diesem Programm von mehr Volumen ab,
   belohnt werden soll genau das, was RPT will — schwerer werden.
   ============================================================ */
/* ---- Kurven ---- */
function series(exId){
  const out = [];
  st.log.forEach(l => {
    if(l.deload) return;                            // Deload verzerrt die Kurve
    const e = l.ex.find(x => x.id === exId);
    if(!e || !e.sets.length) return;
    const s1 = e.sets[0];
    out.push({ w: s1.val, rm: s1.total * (1 + s1.reps/30),
               d: new Date(l.date), reps: s1.reps });
  });
  return out;
}

function chart(pts, key, unit){
  if(pts.length < 2) return `<div class="empty" style="padding:22px">
    Ab der zweiten Einheit entsteht hier eine Kurve.</div>`;
  const W = 300, H = 118, L = 38, R = 8, T = 12, B = 20;
  const ys = pts.map(p => p[key]);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if(hi === lo){ hi = lo + 1; lo = lo - 1; }
  const pad = (hi - lo) * .18; lo -= pad; hi += pad;
  const X = i => L + (W-L-R) * (i / (pts.length - 1));
  const Y = v => T + (H-T-B) * (1 - (v - lo) / (hi - lo));
  const line = pts.map((p,i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p[key]).toFixed(1)}`).join('');
  const dots = pts.map((p,i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p[key]).toFixed(1)}"
    r="2.6" fill="var(--fg)"/>`).join('');
  const grid = [hi, (hi+lo)/2, lo].map(v => `
    <line x1="${L}" y1="${Y(v).toFixed(1)}" x2="${W-R}" y2="${Y(v).toFixed(1)}"
      stroke="var(--line)" stroke-width=".7"/>
    <text x="${L-6}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end"
      font-size="9" fill="var(--mute)" font-family="var(--mono)">${fmt(Math.round(v*10)/10)}</text>`).join('');
  const dt = d => d.toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit'});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">
    ${grid}
    <path d="${line}" fill="none" stroke="var(--fg)" stroke-width="1.5"
      stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    <text x="${L}" y="${H-6}" font-size="9" fill="var(--mute)" font-family="var(--mono)">${dt(pts[0].d)}</text>
    <text x="${W-R}" y="${H-6}" text-anchor="end" font-size="9" fill="var(--mute)"
      font-family="var(--mono)">${dt(pts[pts.length-1].d)}</text>
  </svg>`;
}

function vProg(){
  const all = [];
  st.days.forEach(d => d.ex.forEach(e => all.push(e)));
  const id = view.ex || (all.find(e => series(e.id).length) || all[0]).id;
  const ex = findEx(id), pts = series(id);
  const unit = ex.mode === 'side' ? 'kg je Seite' : 'kg';

  el.innerHTML = head('Fortschritt', '{"name":"home"}')
   + `<div class="chips">${all.map(e => `<button class="chip${e.id===id ? ' on' : ''}"
        data-ex="${e.id}">${esc(e.name)}</button>`).join('')}</div>`
   + `<div class="ex" style="padding:14px 12px 8px">
        <div class="eyebrow" style="padding:0 4px 6px">Arbeitsgewicht Satz 1 · ${unit}</div>
        ${chart(pts, 'w')}</div>`
   + `<div class="ex" style="padding:14px 12px 8px">
        <div class="eyebrow" style="padding:0 4px 6px">Geschätztes 1RM · kg Gesamtlast</div>
        ${chart(pts, 'rm')}</div>`
   + `<div class="note">Das 1RM ist nach Epley geschätzt und berücksichtigt Gewicht und
      Wiederholungen von Satz 1. Es steigt auch dann, wenn das Gewicht gleich bleibt und
      du mehr Wiederholungen schaffst. Deload-Tage sind ausgenommen.</div>`;
}

/* Was an dieser Übung im aktuellen Studio als Satz 1 aufliegen würde.
   Bewusst ohne Deload gerechnet: die Übersicht zeigt den Stand, nicht den Tag. */
function cur1(ex){
  if(ex.mode === 'bw' && topOf(ex) === 0) return '<b>KG</b>';
  if(topOf(ex) === 0) return '<b class="none">kein Gewicht</b>';
  const v = fromTotal(ex, toTotal(ex, topOf(ex), st.bw), st.bw, true);
  if(ex.mode === 'bw') return `<b>KG + ${fmt(v)}<i> kg</i></b>`;
  return `<b>${fmt(v)}<i> kg${ex.mode === 'side' ? ' / Seite' : ''}</i></b>`;
}

function vHome(){
  const last = d => {
    const e = [...st.log].reverse().find(x => x.dayId===d.id);
    if(!e) return 'noch nicht trainiert';
    const days = Math.floor((Date.now() - new Date(e.date)) / 864e5);
    return days===0 ? 'heute' : days===1 ? 'gestern' : 'vor '+days+' Tagen';
  };
  el.innerHTML = `<div class="top"><h1>Reverse&nbsp;Pyramid</h1>
      <button class="back" data-go='{"name":"set"}'>Einstellungen</button></div>
    ${habit()}
    ${sinceBackup() >= (st.backupEvery || 3)
      ? `<div class="backup">
          <span><b>${sinceBackup()} Einheiten ungesichert</b><small>liegen nur auf diesem iPhone</small></span>
          ${backupLink('mini', 'Sichern')}</div>` : ''}
    <div class="eyebrow" style="margin-bottom:10px">Training wählen</div>
    ${st.days.map(d => {
      const running = st.sess && st.sess.dayId === d.id && st.sess.ex.some(e => e.reps.length);
      const done = running ? st.sess.ex.filter(e => e.reps.length).length : 0;
      return `<button class="card${running ? ' running' : ''}" data-go='{"name":"day","id":"${d.id}"}'>
        <div class="hd"><h2>${esc(d.name)}</h2>
          <span>${running ? done+' von '+d.ex.length+' · läuft' : last(d)}</span></div>
        <div class="rows">${d.ex.map(e => `<div>
          <em>${esc(e.name)}</em>${cur1(e)}</div>`).join('')}</div></button>`;
     }).join('')}
    <div class="hr"></div>
    <button class="card" data-go='{"name":"prog"}'><h2>Fortschritt</h2>
      <p>Kraftkurven und geschätztes 1RM je Übung</p></button>
    <button class="card" data-go='{"name":"hist"}'><h2>Verlauf</h2>
      <p>${st.log.length} abgeschlossene Einheiten</p></button>`;

/* Letzte reguläre Einheit einer Übung. Sätze 2+ haben programmseitig kein Ziel,
   das Ergebnis vom letzten Mal ist aber die Zahl, die es zu schlagen gilt. */
function lastSession(exId){
  for(let i = st.log.length-1; i >= 0; i--){
    if(st.log[i].deload) continue;
    const e = st.log[i].ex.find(x => x.id === exId);
    if(e && e.sets && e.sets.length) return e;
  }
  return null;
}

/* Was in der rechten Spalte einer Satzzeile steht. */
function target(ex, n, v, cur, rec, prev){
  const ps = prev && prev.sets[n-1];
  const same = ps && Math.abs(ps.val - v) < 1e-9;
  const old = ps ? (same ? `zuletzt ${ps.reps}` : `zuletzt ${ps.reps} bei ${fmt(ps.val)}`) : '';

  if(n <= cur){                                       // erledigt
    const d = same ? rec.reps[n-1] - ps.reps : null;
    const delta = d === null ? '' :
      d > 0 ? `<small class="up">+${d}</small>` :
      d < 0 ? `<small class="dn">−${-d}</small>` : `<small>±0</small>`;
    return `&#10003; <em>${rec.reps[n-1]}</em> Wdh. <u>&#9998;</u>${delta}`;
  }
  if(n === 1) return `Ziel ${ex.goal}${old ? `<small>${old}</small>` : ''}`;
  return `${ps ? old : 'AMRAP'}<small>${ps ? 'AMRAP' : 'kein festes Ziel'}</small>`;
}

function vDay(){
  const d = st.days.find(x => x.id===view.id);
  if(!st.sess || st.sess.dayId !== d.id){
    if(st.sess && st.sess.ex.some(e => e.reps.length)
       && !confirm('Es läuft noch eine Einheit an einem anderen Tag. Verwerfen?')){
      view = {name:'day', id:st.sess.dayId}; return vDay();
    }
    st.sess = { dayId:d.id, ex:d.ex.map(e => ({id:e.id, reps:[], w:[]})) }; save();
  }
  const s = st.sess;
  const ready = e => topOf(e) > 0 || e.mode === 'bw';          // ohne Gewicht nicht trainierbar
  const done = d.ex.every((e,i) => !ready(e) || s.ex[i].reps.length === e.sets)
            && s.ex.some(e => e.reps.length);

  const started = s.ex.some(e => e.reps.length);
  el.innerHTML = head(d.name, '{"name":"home"}')
   + (started && !s.deload ? '' : `<button class="toggle" style="margin-bottom:12px" data-deload="1">
        <span><b>Deload-Tag</b><small>alle Lasten −15 %, keine Steigerung</small></span>
        <i class="sw ${s.deload ? 'on' : ''}"></i></button>`)
   + d.ex.map((ex, i) => {
    const p = plan(ex), rec = s.ex[i];
    if(topOf(ex) === 0 && ex.mode !== 'bw')
      return `<div class="ex"><div class="ex-head"><h2>${esc(ex.name)}</h2>
        <button class="gear" data-edit="${ex.id}">⚙</button></div>
        <div class="empty" style="padding:16px">Arbeitsgewicht für Satz 1 fehlt.<br>
          <button class="btn ghost" style="margin-top:10px" data-edit="${ex.id}">Gewicht eintragen</button></div></div>`;

    const cur = rec.reps.length;                      // Index des nächsten Satzes
    const prev = lastSession(ex.id);
    const rows = p.map(x => {
      const w = Math.round(x.ratio * 100);   // Breite = Last im Verhältnis zu Satz 1
      const state = x.n <= cur ? 'done' : x.n === cur+1 ? 'active' : '';
      const fixing = view.fix && view.fix.id === ex.id && view.fix.n === x.n;
      const v = x.n <= cur && rec.w[x.n-1] != null ? rec.w[x.n-1] : x.val;
      const tot = toTotal(ex, v, st.bw);
      return `<div class="set ${state}${fixing ? ' fixing' : ''}"
        ${x.n <= cur ? `data-fix="${ex.id}:${x.n}"` : ''}>
        <div class="fill" style="width:${w}%"></div>
        <div class="n">${x.n}</div>
        <div class="w"><b>${label(ex, v)}</b><small>${sub(ex, v, tot)}</small></div>
        <div class="r">${target(ex, x.n, v, cur, rec, prev)}</div></div>`;
    }).join('');

    let body = '';
    const fixing = view.fix && view.fix.id === ex.id;
    if(fixing){
      const n = view.fix.n;
      const wv = rec.w[n-1] != null ? rec.w[n-1] : p[n-1].val;
      body = `<div class="entry">
        <div class="stepper">
          <button data-wt="-1">−</button>
          <div class="val" id="wv-${ex.id}">${fmt(wv)}<span>kg${ex.mode==='side' ? ' / Seite' : ''}</span></div>
          <button data-wt="1">+</button>
        </div>
        <div class="stepper">
          <button data-rep="-1">−</button>
          <div class="val" id="rv-${ex.id}">${rec.reps[n-1]}<span>Wdh.</span></div>
          <button data-rep="1">+</button>
        </div>
        ${n === 1 ? `<p style="font-size:12px;color:var(--mute);margin:0 0 10px;line-height:1.45">
          Satz 1 ist der Anker. Änderst du hier das Gewicht, rechnen sich die
          folgenden Sätze neu.</p>` : ''}
        <button class="btn primary" data-fixsave="${ex.id}">Satz ${n} korrigieren</button>
        <button class="btn ghost" data-fixcancel="1">Abbrechen</button></div>`;
    } else if(cur < ex.sets){
      // Vorschlag aus der letzten Einheit, nicht Ziel+1: der Guide warnt
      // ausdrücklich davor, Sätze 2+ als "vorheriger Satz +1" zu verstehen
      const prev = [...st.log].reverse().find(l => l.ex.some(e => e.id===ex.id));
      const pe = prev && prev.ex.find(e => e.id===ex.id);
      const guess = pe && pe.sets[cur] ? pe.sets[cur].reps : ex.goal;
      body = `<div class="entry">
        <div class="stepper">
          <button data-rep="-1">−</button>
          <div class="val" id="rv-${ex.id}">${guess}<span>Wdh.</span></div>
          <button data-rep="1">+</button>
        </div>
        <button class="btn primary" data-log="${ex.id}">Satz ${cur+1} speichern</button></div>`;
    } else if(ex.mode === 'bw' && topOf(ex) === 0){
      const r = rec.reps[0];
      body = r >= 10
        ? `<div class="note"><b>Bereit für Zusatzgewicht.</b> ${r} Wdh. mit Körpergewicht →
            nächstes Mal Gürtel mit 5 kg. Ab dann greift der 10-%-Breakdown.</div>`
        : r < 6
        ? `<div class="note"><b>Noch unter 6 Wdh.</b> Der Guide empfiehlt bis dahin Latzug oder
            Klimmzüge mit Band statt freier Wiederholungen.</div>`
        : `<div class="note"><b>Weiter mit Körpergewicht.</b> Ab 10 sauberen Wdh. im ersten Satz
            steigst du auf +5 kg um. Noch ${10 - r} zu gehen.</div>`;
    } else if(rec.reps[0] > ex.goal){
      body = `<div class="note"><b>Ziel geknackt.</b> ${rec.reps[0]} > ${ex.goal} Wdh. in Satz 1 →
        nächstes Mal ${fmt(topOf(ex) + incOf(ex))} kg${ex.mode==='side' ? ' je Seite' : ''}.</div>`;
    }
    if(!fixing && cur >= 1 && rec.reps[0] < ex.goal - 1 && !(ex.mode==='bw' && topOf(ex)===0)){
      const t = calibrate(ex, p[0].total, rec.reps[0]);
      body = `<div class="note"><b>Satz 1 war zu schwer.</b> Der Guide will dich bei
        Ziel bis Ziel−1 starten, also ${ex.goal-1} bis ${ex.goal} Wdh. Rechnerisch passen
        ${fmt(fromTotal(ex, t, st.bw))} kg${ex.mode==='side' ? ' je Seite' : ''}.</div>` + body;
    }
    if(!fixing && cur === 1 && rec.reps[0] >= ex.goal + 3 && !(ex.mode==='bw' && topOf(ex)===0)){
      const t = calibrate(ex, p[0].total, rec.reps[0]);
      body = `<div class="note"><b>Satz 1 war zu leicht.</b> Bei ${rec.reps[0]} statt ${ex.goal} Wdh.
        wären rechnerisch ${fmt(fromTotal(ex, t, st.bw))} kg${ex.mode==='side' ? ' je Seite' : ''} passend.
        Der Guide will dich bei Ziel bis Ziel−1 starten.</div>` + body;
    }
    const clock = '';
    // Grobe Scheiben können zwei Sätze auf dieselbe Last fallen lassen
    const flat = p.some((x,i) => i > 0 && Math.abs(x.val - p[i-1].val) < 1e-9 && x.val > 0);

    return `<div class="ex"><div class="ex-head"><h2>${esc(ex.name)}</h2>
      <div class="tag">${ex.sets}×${ex.goal}${ex.mode==='bw' && topOf(ex)===0 ? ' · Körpergewicht' : ' · −'+fmt(ex.bd*100)+'%'}</div>
      <button class="gear" data-edit="${ex.id}">⚙</button></div>
      <div class="pyr">${rows}</div>${flat ? `<div class="note" style="margin:2px 16px 12px">
        Zwei Sätze liegen auf demselben Gewicht. Dein kleinster Schritt ist
        ${fmt(stepOf(ex))} kg, damit lässt sich der Breakdown von
        ${fmt(ex.bd*100)} % hier nicht feiner abbilden. Gleiches Gewicht heißt nicht
        gleicher Satz: beide bleiben AMRAP.</div>` : ''}${clock}${body}</div>`;
  }).join('')
  + (() => {
      const first = d.ex.find(e => topOf(e) > 0);
      if(!first) return '';
      const t1 = toTotal(first, plan(first)[0].val, st.bw);
      // 40 % der Gesamtlast kann unter dem Stangengewicht liegen, dann ist die
      // leere Stange die Untergrenze
      const u = first.mode === 'side' ? ' kg je Seite' : ' kg';
      const show = f => {
        const v = fromTotal(first, t1*f, st.bw);
        return v <= 0 ? (first.mode === 'side' && first.bar > 0 ? 'leere Stange' : 'nur Körpergewicht')
                      : fmt(v) + u;
      };
      return `<div class="note" style="margin:16px 0">
        <b>Aufwärmen für ${esc(first.name)}:</b> 2–5 Sätze à 3–6 Wdh., von ${show(.40)}
        bis ${show(.67)} als letztem Aufwärmsatz. Klar getrennt vom Arbeitssatz,
        keine halbgaren Sätze dazwischen.<br>
        <b>Jeder Satz ist AMRAP:</b> so viele saubere Wdh. wie möglich, abbrechen sobald
        du an der nächsten zweifelst. Sätze 2 und 3 haben kein eigenes Ziel.</div>`;
     })()
  + (done ? `<button class="btn primary" data-finish="1">Einheit abschließen</button>` : '');

}

function mmss(s){ s = Math.max(0, Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
/* Die Uhr liegt im gespeicherten Zustand, nicht in der Ansicht. Dadurch
   überlebt sie Navigation, App-Wechsel und sogar das Schließen der App:
   gespeichert wird der Endzeitpunkt, nicht die Restzeit. */
function clockHTML(){
  if(!st.rest) return '';
  const left = Math.round((st.rest.end - Date.now())/1000);
  if(left < -900){ st.rest = null; save(); return ''; }        // nach 15 Min aufgeben
  return `<div class="clock ${left<=0 ? 'ready' : ''}" id="clock">
    <div class="t">${mmss(left)}</div>
    <div class="lbl">${left > 0 ? 'Pause' : 'Bereit'} · ${esc(st.rest.name)}</div>
    <button class="x" data-skip="1">&#10005;</button></div>`;
}

/* Bildschirm während der Pause wachhalten (Safari 16.4+). iOS gibt die Sperre
   beim Wegschalten automatisch frei, deshalb wird sie bei Rückkehr neu geholt. */
let wake = null;
async function keepAwake(on){
  try {
    if(on && !wake && 'wakeLock' in navigator){
      wake = await navigator.wakeLock.request('screen');
      wake.addEventListener('release', () => { wake = null; });
    } else if(!on && wake){
      const w = wake; wake = null; await w.release();
    }
  } catch(e){ wake = null; }
}
function syncWake(){
  const run = st.rest && Date.now() < st.rest.end;
  keepAwake(!!run);
}

let beeped = false, audioReady = false, beepTimer = null;

/* iOS: das Element muss einmal in einer Nutzeraktion angestoßen worden sein.
   audioSession.type sagt dem System, um welche Art Ton es sich handelt.
   'transient' ist der Typ für einen Signalton: er legt sich über laufende
   Musik und senkt sie höchstens kurz ab. 'playback' wäre ein exklusiver Typ
   und würde Spotify anhalten. */
function audioMode(){
  try { if(navigator.audioSession) navigator.audioSession.type = 'transient'; } catch(e){}
}
audioMode();

function unlockAudio(){
  if(audioReady) return; audioReady = true;
  const el = document.getElementById('ping'); if(!el) return;
  el.muted = true;
  const pr = el.play();
  if(pr && pr.then) pr.then(() => { el.pause(); el.currentTime = 0; el.muted = false; })
                      .catch(() => { el.muted = false; });
  else { el.pause(); el.currentTime = 0; el.muted = false; }
}

function beep(){
  if(beeped || st.sound === false) return; beeped = true;
  const el = document.getElementById('ping'); if(!el) return;
  audioMode();
  try { el.currentTime = 0; const pr = el.play(); if(pr && pr.catch) pr.catch(() => {}); } catch(e){}
}

// Zusätzlich exakt auf die Sekunde legen, falls der 500-ms-Takt gedrosselt wird
function scheduleBeep(){
  clearTimeout(beepTimer);
  if(!st.rest || st.sound === false) return;
  const ms = st.rest.end - Date.now();
  if(ms > 0 && ms < 36e5) beepTimer = setTimeout(beep, ms);
}

function tick(){
  timer = setInterval(() => {
    const c = document.getElementById('clock');
    if(!st.rest || !c) return clearInterval(timer);
    const left = Math.round((st.rest.end - Date.now())/1000);
    c.querySelector('.t').textContent = mmss(left);
    if(left <= 0){
      c.classList.add('ready');
      c.querySelector('.lbl').textContent = 'Bereit · ' + st.rest.name;
      beep(); keepAwake(false); clearInterval(timer);
    }
  }, 500);
}

// Rückkehr aus dem Hintergrund: Uhr sofort auf den echten Stand bringen
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && st.rest){ scheduleBeep(); syncWake(); render(); }
  if(document.hidden) wake = null;                   // iOS gibt die Sperre selbst frei
});

/* Nachträgliche Korrektur einer abgeschlossenen Einheit.
   Betrifft die Korrektur den jüngsten Eintrag einer Übung, wird die
   Progression daraus neu berechnet und das Arbeitsgewicht angepasst. */
function findEx(id){
  for(const d of st.days){ const e = d.ex.find(x => x.id===id); if(e) return e; }
  return null;
}
function reapply(li, exId){
  const later = st.log.slice(li+1).some(s => s.ex.some(e => e.id===exId));
  if(later) return false;                                  // neuere Einheit hat Vorrang
  if(st.log[li].deload) return false;                      // Deload zählt nicht
  const entry = st.log[li].ex.find(e => e.id===exId), ex = findEx(exId);
  if(!entry || !ex) return false;
  const r = entry.sets[0].reps;
  let nt = entry.oldTop;
  if(ex.mode==='bw' && entry.oldTop===0){ if(r >= 10) nt = 5; }
  else if(r > ex.goal) nt = round(entry.sets[0].val + incOf(ex), stepOf(ex));
  const changed = nt !== entry.newTop;
  entry.newTop = nt; setTop(ex, nt);
  return changed;
}

function vHistEdit(){

  const d = new Date(s0.date).toLocaleDateString('de-DE',

  el.innerHTML = head(s0.dayName, '{"name":"hist"}')

   + s0.ex.map(e => {

          data-hfix="${e.id}:${k+1}">

      const entry = fixing ? `<div class="entry">

            <button data-rep="-1">−</button>
            <div class="val" id="rv-${e.id}">${e.sets[view.fix.n-1].reps}<span>Wdh.</span></div>
            <button data-rep="1">+</button>
          </div>
          <button class="btn primary" data-hsave="${e.id}">Satz ${view.fix.n} korrigieren</button>

      return `<div class="ex"><div class="ex-head"><h2>${esc(e.name)}</h2></div>
        <div class="pyr">${rows}</div>${entry}</div>`;
     }).join('')
   + `<div class="note" style="margin:16px 0">Korrigierst du Satz 1 der zuletzt absolvierten Einheit
        einer Übung, passt die App das aktuelle Arbeitsgewicht mit an.</div>

}

function vHist(){
  el.innerHTML = head('Verlauf', '{"name":"home"}')
   + (st.log.length ? st.log.map((s,i) => ({s,i})).reverse().map(({s,i}) => `<div class="ex" style="padding:14px 16px" data-hist="${i}">
      <div class="eyebrow" style="margin-bottom:8px">${new Date(s.date).toLocaleDateString('de-DE',
        {weekday:'short', day:'2-digit', month:'2-digit', year:'2-digit'})} · ${esc(s.dayName)}${
        s.deload ? ' · Deload' : ''}</div>
      <div class="log">${s.ex.map(e => `<b>${esc(e.name)}</b> ${e.sets.map(x =>
        (e.mode==='bw' ? (x.val>0 ? 'KG+'+fmt(x.val) : 'KG') : fmt(x.val)+'kg')+'×'+x.reps).join('  ')}${
        e.newTop > e.oldTop ? ` <span class="up">↑ ${fmt(e.newTop)}</span>` : ''}`).join('<br>')}</div>
      <div style="font-size:11.5px;color:var(--mute);margin-top:9px">Antippen zum Korrigieren</div></div>`).join('')
    : `<div class="empty">Noch keine Einheit abgeschlossen.<br>Nach dem ersten Training steht hier,
       was du bewegt hast und wo es hochgeht.</div>`);
}

/* ---------- Interaktion ---------- */
document.addEventListener('click', e => {
  unlockAudio();
  // Abgelaufene Uhr räumt sich beim nächsten Tipp selbst weg
  if(st.rest && Date.now() > st.rest.end && !e.target.closest('.clock')){
    st.rest = null; save(); keepAwake(false);
  }
  const t = e.target.closest('[data-go],[data-edit],[data-rep],[data-wt],[data-log],[data-finish],[data-savex],[data-savebw],[data-skip],[data-didbackup],[data-sound],[data-deload],[data-ex],[data-saveeq],[data-fix],[data-fixsave],[data-fixcancel],[data-hist],[data-hfix],[data-hsave],[data-hdel]');
  if(!t) return;

  if(t.dataset.go){ const g = JSON.parse(t.dataset.go); view.fix = null;
    view = g; return render(); }
  if(t.dataset.edit){ view = {name:'edit', id:t.dataset.edit, dayId:view.id}; return render(); }
  if(t.dataset.deload){
    st.sess.deload = !st.sess.deload; save(); view.keep = window.scrollY; return render();
  }
  if(t.dataset.saveeq){
    const num = id => parseFloat(String(document.getElementById(id).value).replace(',','.')) || 0;
    const e = st.equip;
    e.bar = num('e-bar'); e.step = num('e-step') || 2.5; e.stack = num('e-stack') || 1;
    const pl = document.getElementById('e-pl').value.split(',')
      .map(x => parseFloat(x.replace(',','.'))).filter(x => x > 0).sort((a,b) => b-a);
    if(pl.length) e.plates = pl;
    save(); return render();
  }
  if(t.dataset.ex){ view = {name:'prog', ex:t.dataset.ex}; return render(); }
  if(t.dataset.skip){ st.rest = null; save(); clearTimeout(beepTimer); keepAwake(false); return render(); }

  if(t.dataset.fix){
    const [id, n] = t.dataset.fix.split(':');
    view.fix = {id, n: Number(n)}; view.keep = window.scrollY; return render();
  }
  if(t.dataset.fixcancel){ view.fix = null; view.keep = window.scrollY; return render(); }

  if(t.dataset.hist){ view = {name:'histedit', i: Number(t.dataset.hist)}; return render(); }
  if(t.dataset.hfix){
    const [id, n] = t.dataset.hfix.split(':');
    view.fix = {id, n: Number(n)}; view.keep = window.scrollY; return render();
  }
  if(t.dataset.hsave){
    const id = t.dataset.hsave, e = st.log[view.i].ex.find(x => x.id===id);
    e.sets[view.fix.n-1].reps = parseInt(document.getElementById('rv-'+id).firstChild.textContent) || 0;
    if(view.fix.n === 1) reapply(view.i, id);
    save(); view.fix = null; view.keep = window.scrollY; return render();
  }
  if(t.dataset.hdel){
    if(!confirm('Diese Einheit endgültig aus dem Verlauf entfernen?')) return;
    st.log.splice(Number(t.dataset.hdel), 1); save();
    view = {name:'hist'}; return render();
  }
  if(t.dataset.fixsave){
    const id = t.dataset.fixsave, n = view.fix.n;
    const rec = st.sess.ex.find(x => x.id === id), ex = findEx(id);
    rec.reps[n-1] = parseInt(document.getElementById('rv-'+id).firstChild.textContent) || 0;
    const nw = parseFloat(document.getElementById('wv-'+id).firstChild.textContent.replace(',','.'));
    if(!isNaN(nw)){
      rec.w[n-1] = nw;
      if(n === 1){                                  // Anker verschoben: Rest neu rechnen
        setTop(ex, nw); save();
        const np = plan(ex);
        for(let k = 1; k < rec.w.length; k++) rec.w[k] = np[k].val;
      }
    }
    save(); view.fix = null; view.keep = window.scrollY; return render();   // Pausenuhr läuft weiter
  }

  if(t.dataset.wt){
    const ex = findEx(view.fix.id);
    const box = t.parentElement.querySelector('.val');
    const cur = parseFloat(box.firstChild.textContent.replace(',','.')) || 0;
    const sp = stepOf(ex);
    box.firstChild.textContent = fmt(Math.max(0, round(cur + parseInt(t.dataset.wt)*sp, sp)));
    return;
  }

  if(t.dataset.rep){
    const box = t.parentElement.querySelector('.val');
    const v = Math.max(0, parseInt(box.firstChild.textContent) + parseInt(t.dataset.rep));
    box.firstChild.textContent = v; return;
  }

  if(t.dataset.log){
    const d = st.days.find(x => x.id===view.id), ex = d.ex.find(x => x.id===t.dataset.log);
    const reps = parseInt(document.getElementById('rv-'+ex.id).firstChild.textContent) || 0;
    const rec = st.sess.ex.find(x => x.id===ex.id);
    rec.reps.push(reps);
    rec.w.push(plan(ex)[rec.reps.length-1].val);        // Gewicht des Satzes festhalten
    beeped = false;
    st.rest = { id:ex.id, name:ex.name, end:Date.now() + ex.rest*1000 };
    save();                                             // Einheit und Uhr überstehen App-Wechsel
    scheduleBeep(); syncWake();
    view.keep = window.scrollY;
    return render();
  }

  if(t.dataset.finish){
    const d = st.days.find(x => x.id===view.id);
    const entry = { date:new Date().toISOString(), dayId:d.id, dayName:d.name,
      deload: !!st.sess.deload, ex:[] };
    d.ex.forEach((ex, i) => {
      const reps = st.sess.ex[i].reps; if(!reps.length) return;
      const used = st.sess.ex[i].w;
      const p = plan(ex), oldTop = topOf(ex);
      const base = used[0] != null ? used[0] : p[0].val;   // was wirklich auf der Stange lag
      if(st.sess.deload){
        /* Deload-Tag zählt nicht für die Progression */
      } else if(ex.mode === 'bw' && topOf(ex) === 0){
        // Guide: ab 10 sauberen Wdh. mit Körpergewicht auf +5 kg umsteigen
        if(reps[0] >= 10) setTop(ex, 5);
      } else if(reps[0] > ex.goal){
        setTop(ex, round(base + incOf(ex), stepOf(ex)));                // doppelte Progression
      }
      entry.ex.push({ id:ex.id, name:ex.name, oldTop, newTop:topOf(ex), mode:ex.mode,
        sets: reps.map((r, n) => {
          const v = used[n] != null ? used[n] : p[n].val;
          return { val:v, total:toTotal(ex, v, st.bw), reps:r };
        }) });
    });
    st.sess = null; st.rest = null; keepAwake(false);
    st.log.push(entry); save();
    view = {name:'home'}; return render();
  }

  if(t.dataset.savex){
    const d = st.days.find(x => x.id===view.dayId), ex = d.ex.find(x => x.id===view.id);
    const num = id => parseFloat(String(document.getElementById(id).value).replace(',','.')) || 0;
    setTop(ex, num('f-top')); ex.goal = Math.max(1, num('f-goal')); ex.sets = Math.min(5, Math.max(1, num('f-sets')));
    ex.bd = parseFloat(document.getElementById('f-bd').value); ex.mode = document.getElementById('f-mode').value;
    ex.bar = parseFloat(document.getElementById('f-bar').value) > 0 ? 20 : 0;
    ex.step = num('f-step'); ex.inc = num('f-inc'); ex.rest = num('f-rest') || 180;
    save(); view = {name:'day', id:d.id}; return render();
  }

  if(t.dataset.savebw){
    st.bw = parseFloat(String(document.getElementById('f-bw').value).replace(',','.')) || st.bw;
    const ev = document.getElementById('f-every');
    if(ev) st.backupEvery = Math.max(1, parseInt(ev.value) || 3);
    save(); view = {name:'home'}; return render();
  }

  if(t.dataset.didbackup){ st.lastBackup = Date.now(); save(); setTimeout(render, 600); return; }
  if(t.dataset.sound){
    st.sound = !(st.sound !== false); save();
    if(st.sound){ beeped = false; beep(); beeped = false; scheduleBeep(); }   // einmal vorhören
    return render();
  }
});

/* Sicherung. iOS kann eine Web-App nicht still in die iCloud schreiben, also
   bleibt der Weg über einen Download. Damit das die App nicht verlässt, ist der
   Knopf ein echtes <a download>: der Tipp ist dann eine direkte Nutzeraktion auf
   einem Link, iOS fragt inline nach und man bleibt, wo man ist. Wohin die Datei
   geht, steht unter Einstellungen > Apps > Safari > Downloads. */
let blobUrl = null;
function backupHref(){
  if(blobUrl) URL.revokeObjectURL(blobUrl);
  blobUrl = URL.createObjectURL(new Blob([JSON.stringify(st)], {type:'application/json'}));
  return blobUrl;
}
function backupName(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `rpt-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`;
}
function backupLink(cls, text){
  return `<a class="${cls}" href="${backupHref()}" download="${backupName()}"
    data-didbackup="1" rel="noopener">${text}</a>`;
}
// Wie viele Einheiten seit der letzten Sicherung dazugekommen sind
function sinceBackup(){
  if(!st.lastBackup) return st.log.length;
  return st.log.filter(l => new Date(l.date).getTime() > st.lastBackup).length;
}

// Backup einlesen — ersetzt den kompletten Stand
document.addEventListener('change', e => {
  if(e.target.id !== 'f-imp') return;
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    let p; try { p = JSON.parse(r.result); } catch(err){ p = null; }
    if(!p || !Array.isArray(p.days) || !Array.isArray(p.log))
      return alert('Diese Datei ist kein Backup aus dieser App.');
    st = p; save(); view = {name:'home'}; render();
  };
  r.onerror = () => alert('Die Datei ließ sich nicht lesen.');
  r.readAsText(f);
});

// Bittet iOS, den Speicher dauerhaft zu behalten statt ihn bei Bedarf zu räumen
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
scheduleBeep();
syncWake();
</script>
